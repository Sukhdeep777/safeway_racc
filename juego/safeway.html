<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFEWAY_RACC GAME</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container" id="game-container">
            
            <div id="intro-screen">
                <video id="intro-video" autoplay loop muted playsinline>
                    <source src="videos/inicio.mp4" type="video/mp4">
                    Tu navegador no soporta video.
                </video>
                <div class="press-key-msg">
                    <span class="sub-text">(Qualsevol tecla per començar)</span>
                </div>
            </div>
            
            <div id="bus-video-screen" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4500; background-color: black; flex-direction: column; justify-content: center; align-items: center;">
                <video id="bus-video" playsinline style="width: 100%; height: 100%; object-fit: cover;">
                    <source src="videos/autobus.mp4" type="video/mp4">
                    Tu navegador no soporta video.
                </video>
            </div>

            <div id="scooter-video-screen" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4500; background-color: black; flex-direction: column; justify-content: center; align-items: center;">
                <video id="scooter-video" playsinline style="width: 100%; height: 100%; object-fit: cover;">
                    <source src="videos/patinete.mp4" type="video/mp4">
                    Tu navegador no soporta video.
                </video>
            </div>

            <div id="black-curtain"></div>

            <img src="imagenes/teclastutorial.png" id="tutorial-teclas" class="tutorial-keys" alt="Tutorial Controles">

            <div id="level1-exit" class="interactive-object">
                <img src="imagenes/teclae.gif" id="key-prompt" class="prompt-icon" alt="Presiona E">
                <img src="imagenes/puertaabierta.png" class="door-img" alt="Salida">
            </div>

            <div id="player" class="player">
                <img id="player-img" src="animaciones/paradoderecha.gif" alt="player">
            </div>

            <div id="car-obstacle"></div>

            <div id="level2-interactions">
                <div id="prompt-sign" class="prompt-l2">
                    <img src="imagenes/teclae.gif">
                </div>
                
                <div id="prompt-scooter" class="prompt-l2">
                    <img src="imagenes/teclae.gif">
                </div>

                <div id="prompt-car" class="prompt-l2">
                    <img src="imagenes/teclae.gif">
                </div>

                <div id="prompt-park" class="prompt-l2">
                    <img src="imagenes/teclae.gif">
                    <p style="color:white; background:black; padding:2px; font-size:12px; text-align:center;">PARC</p>
                </div>
            </div>

            <img src="imagenes/flecha1.gif" id="arrow-forward" alt="Siguiente">

            <div id="prompt-crosswalk" class="prompt-l2">
                <img src="imagenes/teclae.gif">
            </div>
            
            <img src="imagenes/coche.png" id="killer-car" alt="Coche asesino">

            <div id="game-over-screen" class="game-over-box">
                <h1 class="game-over-title">HAS ESTAT ATROPELLAT!</h1>
                <p id="game-over-text" style="color:white; margin-bottom: 30px;">Creuar en vermell no ha estat una bona idea...</p>
                <button id="btn-retry" class="btn btn-yes">Torna-ho a intentar</button>
            </div>
            
            <div id="victory-screen" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 100; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center;">
                <h2 style="color: #4CAF50; font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px #000;">Objectiu Aconseguit!</h2>
                <p style="font-size: 1.5em; margin-bottom: 30px;">Has arribat a casa sa i estalvi gràcies a la teva prudència.</p>
                <button id="btn-play-again" style="padding: 15px 30px; font-size: 1.2em; cursor: pointer; background-color: #f1c40f; color: #333; border: none; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s;">
                    Tornar a jugar (Provar altres camins)
                </button>
            </div>
        
            <div id="dialogue-box" class="dialogue-container">
                <div class="dialogue-content">
                    <span id="speaker-name" class="speaker-name"></span>
                    <p id="dialogue-text" class="dialogue-text"></p>
                </div>
                <div class="continue-prompt">
                    <span class="key-cap">E</span> CONTINUAR
                </div>
            </div>

            <div id="confirmation-modal" class="confirmation-box">
                <p class="confirm-text">Estàs segur de triar esta opció?</p>
                <div class="confirm-buttons">
                    <button id="btn-yes" class="btn btn-yes">SÍ</button>
                    <button id="btn-no" class="btn btn-no">NO</button>
                </div>
            </div>
            
        </div> </div> 
        <script src="javascript/index.js"></script>
</body>
</html>
